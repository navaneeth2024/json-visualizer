<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unfollow Instagram Helper</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Responsive tweaks for mobile */
    @media (max-width: 600px) {
      .mui-card {
        padding: 1rem !important;
        margin-top: 1rem !important;
      }
      .navbar-content {
        flex-direction: column;
        align-items: flex-start;
      }
      .navbar-title {
        margin-bottom: 0.5rem;
      }
      table {
        font-size: 0.95rem;
      }
      th, td {
        padding: 0.5rem !important;
      }
    }

    #instaTableContainer {
      overflow-x: auto;
      width: 100%;
      max-width: 100vw;
    }

    table {
      width: 100%;
      min-width: 400px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    /* Pagination styling */
    #pagination {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .btn {
      background-color: #016B61;
      color: white;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #708871;
    }

    select, input[type="number"] {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px 8px;
    }

    .text-gray-400 {
      color: #999;
    }
  </style>
</head>
<body class="flex flex-col items-center bg-[var(--bg-light)] text-[var(--text-dark)]">
  <nav class="navbar">
    <div class="navbar-content">
      <span class="navbar-title">Unfollow Instagram Helper</span>
      <div class="navbar-actions">
        <a href="index.html" class="btn">Back to JSON Visualizer</a>
      </div>
    </div>
  </nav>

  <main class="mui-card mt-8 p-8 max-w-xl w-full text-center">
    <h2 class="text-2xl font-semibold mb-4">Unfollow Instagram Helper</h2>
    <input type="file" id="instaJsonFile" accept=".json" class="hidden" />
    <label for="instaJsonFile" class="btn cursor-pointer mb-3">Choose Instagram JSON File</label>
    <p id="instaFileName" class="mb-4 text-gray-600 text-sm"></p>

    <div id="instaTableContainer" class="overflow-x-auto mt-4"></div>

    <!-- Pagination Controls -->
    <div id="pagination" class="hidden">
      <div class="flex items-center gap-2">
        <label for="rowsPerPage">Rows per page:</label>
        <select id="rowsPerPage">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="75">75</option>
          <option value="100">100</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <button id="prevBtn" class="btn">⬅ Prev</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="btn">Next ➡</button>
      </div>
      <div class="flex items-center gap-2">
        <label for="gotoPage">Go to:</label>
        <input id="gotoPage" type="number" min="1" class="w-16 text-center" />
        <button id="gotoBtn" class="btn">Go</button>
      </div>
    </div>

    <p class="text-sm text-gray-400 mt-6">(Feature coming soon)</p>
  </main>

  <script>
    const fileInput = document.getElementById('instaJsonFile');
    const fileName = document.getElementById('instaFileName');
    const tableContainer = document.getElementById('instaTableContainer');

    const pagination = document.getElementById('pagination');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const rowsPerPageSelect = document.getElementById('rowsPerPage');
    const gotoPage = document.getElementById('gotoPage');
    const gotoBtn = document.getElementById('gotoBtn');

    let currentPage = 1;
    let rowsPerPage = 25;
    let allData = [];
    let columns = [];

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileName.textContent = `Loaded: ${file.name}`;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        allData = extractRecords(json);
        columns = [...new Set(allData.flatMap(r => Object.keys(r)))];
        currentPage = 1;
        renderPaginatedTable();
      } catch (err) {
        fileName.textContent = 'Invalid JSON file!';
        tableContainer.innerHTML = '';
      }
    });

    rowsPerPageSelect.addEventListener('change', () => {
      rowsPerPage = parseInt(rowsPerPageSelect.value);
      currentPage = 1;
      renderPaginatedTable();
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderPaginatedTable();
      }
    });

    nextBtn.addEventListener('click', () => {
      const totalPages = Math.ceil(allData.length / rowsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderPaginatedTable();
      }
    });

    gotoBtn.addEventListener('click', () => {
      const target = parseInt(gotoPage.value);
      const totalPages = Math.ceil(allData.length / rowsPerPage);
      if (!isNaN(target) && target >= 1 && target <= totalPages) {
        currentPage = target;
        renderPaginatedTable();
      }
    });

    function extractRecords(json) {
      let records = [];
      function explore(v) {
        if (Array.isArray(v)) {
          v.forEach(i => {
            const f = flatten(i);
            if (Object.keys(f).length > 0) records.push(f);
          });
        } else if (typeof v === 'object' && v !== null) {
          Object.values(v).forEach(explore);
        }
      }
      explore(json);
      if (records.length === 0 && typeof json === 'object') records.push(flatten(json));
      return records;
    }

    function flatten(o, res = {}) {
      if (typeof o !== 'object' || o === null) return res;
      for (const k in o) {
        if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
        const v = o[k];
        if (Array.isArray(v)) {
          v.forEach(i => { if (typeof i === 'object') flatten(i, res); });
        } else if (typeof v === 'object' && v !== null) {
          flatten(v, res);
        } else {
          res[k] = v;
        }
      }
      return res;
    }

    function renderPaginatedTable() {
      if (!allData.length) {
        tableContainer.innerHTML = '<div class="text-gray-400">No data found in JSON.</div>';
        pagination.classList.add('hidden');
        return;
      }

      const totalPages = Math.ceil(allData.length / rowsPerPage);
      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = allData.slice(start, end);

      const headerRow = `<th class="border px-3 py-2 font-semibold">#</th>` +
        columns.map(c => `<th class="border px-3 py-2 font-semibold">${c}</th>`).join("");
      const bodyRows = pageData.map((row, idx) =>
        `<tr><td class="border px-3 py-2 text-gray-500">${start + idx + 1}</td>` +
        columns.map(col => {
          let val = row[col] ?? "";
          if (typeof val === "string" && val.includes("http")) {
            val = `<a href="${val}" target="_blank" class="text-blue-600 underline break-all">${val}</a>`;
          }
          return `<td class="border px-3 py-2">${val}</td>`;
        }).join("") + "</tr>"
      ).join("");

      tableContainer.innerHTML = `
        <div style="overflow-x:auto;">
          <table class="min-w-full border border-gray-300 text-sm text-left border-collapse rounded-lg">
            <thead><tr>${headerRow}</tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
      `;

      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      pagination.classList.remove('hidden');
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }
  </script>
</body>
</html>
